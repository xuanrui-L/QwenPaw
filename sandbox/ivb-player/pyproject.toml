# IVB 放映端:解析 Creator 导出的互动视频包并提供本地播放服务。
#
# 依赖 FastAPI + uvicorn + SQLite,不依赖 Creator 后端任何代码 ——
# 两者只通过 docs/bundle-format.md 定义的 zip 格式解耦。
#
# 独立包,刻意不挂进仓库根的 workspace:放映端是可分发的第三方程序。
# 用仓库 .venv 直接跑测试即可:
#   ../../.venv/bin/python -m pytest
# 或自建环境:uv venv && uv pip install -e .

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivb-player"
version = "0.1.0"
description = "Interactive Video Bundle player: read, validate and serve .ivb zip bundles"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ivb = "ivb_player.cli:main"

[tool.setuptools.packages.find]
include = ["ivb_player*"]

[tool.setuptools.package-data]
ivb_player = ["static/**/*", "state/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
